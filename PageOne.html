<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Simple Login</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        :root { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
        body {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; background: #f3f4f6;
        }
        .card {
            background: #fff; padding: 24px; border-radius: 8px;
            box-shadow: 0 6px 18px rgba(15,23,42,0.08); width: 320px;
        }
        h1 { margin: 0 0 16px; font-size: 20px; text-align: center; }
        label { display: block; margin: 10px 0 6px; font-size: 13px; color: #374151; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb;
            border-radius: 6px; font-size: 14px; box-sizing: border-box;
        }
        button {
            width: 100%; margin-top: 16px; padding: 10px 12px;
            border: none; border-radius: 6px; background: #2563eb; color: #fff;
            font-size: 15px; cursor: pointer;
        }
        .msg { margin-top: 12px; text-align: center; font-size: 14px; }
        .msg.error { color: #b91c1c; }
        .msg.success { color: #065f46; }
        .hint { margin-top: 8px; font-size: 12px; color: #6b7280; text-align: center; }
    </style>
</head>
<body>
    <main class="card" role="main">
        <h1>Login</h1>
        <form id="loginForm" autocomplete="off" novalidate>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required autofocus />

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required />

            <button type="submit">Sign In</button>
        </form>

        <div id="message" class="msg" aria-live="polite"></div>
        <div class="hint">Demo credentials: <strong>admin / password123</strong></div>
    </main>

    <script>
        // Simple client-side demo validation only. Do NOT use for real authentication.
        const form = document.getElementById('loginForm');
        const msg = document.getElementById('message');

        form.addEventListener('submit', e => {
            e.preventDefault();
            msg.textContent = '';
            msg.className = 'msg';
            const username = form.username.value.trim();
            const password = form.password.value;

            if (!username || !password) {
                show('Please enter both username and password.', 'error');
                return;
            }

            // Demo check (replace with real authentication)
            if (username === 'admin' && password === 'password123') {
                show('Login successful. Redirecting...', 'success');
                // Example: redirect to another page
                // window.location.href = 'dashboard.html';
            } else {
                show('Invalid username or password.', 'error');
            }
        });

        function show(text, type) {
            msg.textContent = text;
            msg.className = 'msg ' + (type === 'success' ? 'success' : 'error');
        }
    </script>
</body>
</html>
